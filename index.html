<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doggo — Legal</title>
  <meta name="description" content="Legal documents for the Doggo mobile app: Privacy Policy, Terms of Use, and Community Guidelines." />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1b2440;
      background: #f6f7fb;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 64px 24px 96px;
    }
    h1 {
      font-size: 32px;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
    }
    p.lead { color: #6b7280; margin: 0 0 32px; }
    ul.links {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 12px;
    }
    ul.links li a {
      display: block;
      background: #fff;
      border-radius: 14px;
      padding: 18px 20px;
      text-decoration: none;
      color: #1b2440;
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    ul.links li a:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }
    ul.links li a span {
      display: block;
      font-weight: 400;
      color: #6b7280;
      margin-top: 4px;
      font-size: 14px;
    }
    footer {
      margin-top: 48px;
      color: #9ca3af;
      font-size: 13px;
    }
    a { color: #4c7df1; }
  </style>
</head>
<body>
  <main>
    <h1>Doggo — Legal</h1>
    <p class="lead">Plain-language documents for the Doggo iOS app.</p>
    <ul class="links">
      <li>
        <a href="./privacy.html">
          Privacy Policy
          <span>What we collect, why, and who we share it with.</span>
        </a>
      </li>
      <li>
        <a href="./terms.html">
          Terms of Use
          <span>Apple's Standard EULA applies to your use of Doggo.</span>
        </a>
      </li>
    </ul>
    <footer>
      Questions? Email <a href="mailto:0xpaulius@gmail.com">0xpaulius@gmail.com</a>.
    </footer>
  </main>
</body>
</html>
